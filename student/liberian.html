<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberian-Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: 'outfit',sans-serif;
             background:#f6f5f7;
             display: flex;
        }
        .sidebar{
    width:240px;
    background:#0f1a2e;
    color:white;
    position:fixed;
    top:0;
    left:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:24px 12px;
    z-index:100
}
.brand{
    padding:0 12px 24px;
    border-bottom:1px solid rgba(255,255,255,0.1);
    margin-bottom:16px
}
.brand h1{
    font-size:15px;
    font-weight:700;
}
.brand p{
    font-size:10px;
    color:rgba(255,255,255,0.5);
    letter-spacing:1px;
    margin-top:4px
}
.nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:8px;
    color:rgba(255,255,255,0.6);
    text-decoration:none;
    font-size:13px;
    margin-bottom:4px;
    cursor:pointer;
    transition:0.2s;
    border:none;
    background:transparent;
    width:100%;
    text-align:left
}
.nav-item:hover{
    background:rgba(255,255,255,0.05);
    color:white
}
.nav-item.active{
    background:#1e3a8a;
    color:white;
    font-weight:500;
}
.nav-seperator{
    height:1px;
    background:rgba(255,255,255,0.1);
    margin:16px 0;
}
    </style>
</head>
<body>
   <aside class="sidebar">
  <div class="brand"><h1>MITRC LibSphere</h1><p>Library Management</p></div>

  <button onclick="showPage('dashboard')" id="nav-dashboard" class="nav-item active"><i class="fa-solid fa-table-columns"></i> Dashboard</button>
  <button onclick="showPage('Catalogue')" id="nav-search" class="nav-item"><i class="fa-solid fa-book"></i> Manage Catalogue</button>
  <button onclick="showPage('Issuebook')" id="nav-issuebooks" class="nav-item"><i class="fa-solid fa-arrow-up-from-bracket"></i> Issue Book (<span id="countMyBooks">3</span>)</button>
  <button onclick="showPage('Returnbook')" id="nav-returnbook" class="nav-item"><i class="fa-solid fa-arrow-down"></i> Return Books</button>
  <button onclick="showPage('suggestions')" id="nav-suggestions" class="nav-item"><i class="fa-solid fa-lightbulb"></i> Suggestions</button>

  <div class="nav-seperator"></div> 
  <a href="login.html" class="nav-item" onclick="localStorage.clear()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>

  <div style="margin-top:auto;padding:12px">
    <div style="background:rgba(255,255,255,0.05);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center">
      <div id="avatar" style="width:32px;height:32px;border-radius:50%;background:white;color:#0f1a2e;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">D</div>
      <div><div id="userName" style="font-size:13px;font-weight:500">Liberian</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">MITRC Alwar</div></div>
    </div>
  </div>
</aside>

</body>
</html>
